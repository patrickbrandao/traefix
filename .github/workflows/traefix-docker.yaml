name: Traefix Docker

# Build multi-arch (amd64/arm64) e publicação em docker.io/tmsoftbrasil/traefix.
# Secrets necessários no repositório: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker:
    if: github.repository == 'patrickbrandao/traefix'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version is the one of git describe (fork-point-<n>-g<sha>, or the tag): traefik version and the sender
      # of the fingerprint batches then point at the commit, which a branch name does not.
      - id: version
        run: echo "version=$(git describe --tags --always --match 'fork-point*' --match 'v*')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: tmsoftbrasil/traefix
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # The repository license is the one of Traefik; the image also carries Coraza, the CRS and JA4+ (NOTICE).
          labels: |
            org.opencontainers.image.title=traefix
            org.opencontainers.image.description=Traefix - fork do Traefik
            org.opencontainers.image.licenses=MIT AND Apache-2.0 AND LicenseRef-FoxIO-1.1

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.traefix
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
